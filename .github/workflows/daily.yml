name: Daily snapshot

on:
  schedule:
    # 06:17 UTC every day.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the market file
        run: node scripts/snapshot.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          day=$(ls data/daily | sort | tail -1 | sed 's/\.json$//')
          git commit -m "data: market snapshot ${day}"
          git push
